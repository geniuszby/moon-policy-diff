name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
      - name: Update MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target js
      - name: Test
        run: moon test --target js
      - name: Build
        run: moon build --target js
      - name: Runnable examples
        run: |
          set +e
          moon run cmd/main -- audit examples/saas/before.policy examples/saas/after.policy examples/saas/universe.txt json > audit.json
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const r=require('./audit.json'); if(r.new_grants!==3 || r.gate!=='FAIL') process.exit(1)"
          moon run cmd/main -- verify examples/finance/before.policy examples/finance/universe.txt examples/finance/expected-before.txt
      - name: Format
        run: |
          moon fmt
          git diff --exit-code
